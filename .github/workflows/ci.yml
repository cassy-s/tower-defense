name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Content check + smoke battle
        run: npm run check
      - name: Simulation tests
        run: npm test
      - name: Cache-busting stamps are up to date
        run: node tools/stamp.mjs --check
