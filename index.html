<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- Main Menu -->
  <div id="main-menu" class="overlay active">
    <div class="menu-content">
      <h1 class="game-title">TOWER DEFENSE</h1>
      <div class="title-decoration">
        <span class="title-line"></span>
        <span class="title-diamond"></span>
        <span class="title-line"></span>
      </div>
      <p class="subtitle">Defend your base against waves of enemies</p>
      <button class="btn btn-primary" id="btn-play">PLAY</button>
    </div>
  </div>

  <!-- Mode Select -->
  <div id="mode-select" class="overlay">
    <div class="menu-content">
      <h2 class="section-title">SELECT MODE</h2>
      <p class="section-subtitle">Choose your difficulty</p>
      <div class="mode-grid">
        <button class="btn btn-mode" data-mode="casual">
          <div class="mode-banner">
            <span class="mode-icon">&#127795;</span>
            <span class="mode-name">CASUAL</span>
            <span class="mode-info">25 Waves</span>
          </div>
          <div class="mode-footer">
            <span class="mode-difficulty">EASY</span>
          </div>
        </button>
        <button class="btn btn-mode" data-mode="molten">
          <div class="mode-banner">
            <span class="mode-icon">&#128293;</span>
            <span class="mode-name">MOLTEN</span>
            <span class="mode-info">35 Waves</span>
          </div>
          <div class="mode-footer">
            <span class="mode-difficulty">HARD</span>
          </div>
        </button>
        <button class="btn btn-mode" data-mode="fallen">
          <div class="mode-banner">
            <span class="mode-icon">&#9760;</span>
            <span class="mode-name">FALLEN</span>
            <span class="mode-info">40 Waves</span>
          </div>
          <div class="mode-footer">
            <span class="mode-difficulty">EXTREME</span>
          </div>
        </button>
      </div>
      <button class="btn btn-back" id="btn-back-mode">BACK</button>
    </div>
  </div>

  <!-- Loadout Screen -->
  <div id="loadout-screen" class="overlay">
    <div class="menu-content loadout-content">
      <h2 class="section-title">SELECT YOUR TOWERS</h2>
      <p class="loadout-info">Choose up to 5 towers for your loadout</p>
      <div id="tower-grid" class="tower-grid"></div>
      <div id="loadout-slots" class="loadout-slots">
        <div class="slot empty" data-slot="0"></div>
        <div class="slot empty" data-slot="1"></div>
        <div class="slot empty" data-slot="2"></div>
        <div class="slot empty" data-slot="3"></div>
        <div class="slot empty" data-slot="4"></div>
      </div>
      <div id="tower-preview" class="tower-preview"></div>
      <div class="loadout-buttons">
        <button class="btn btn-back" id="btn-back-loadout">BACK</button>
        <button class="btn btn-primary" id="btn-start-game" disabled>START GAME</button>
      </div>
    </div>
  </div>

  <!-- Game HUD -->
  <div id="game-hud" class="hud hidden">
    <div class="hud-top">
      <div class="hud-stat">
        <span class="icon">&#9876;</span>
        <span class="label">Wave</span>
        <span id="hud-wave">0/25</span>
      </div>
      <div class="hud-stat">
        <span class="icon">&#128176;</span>
        <span class="label">Cash</span>
        <span id="hud-cash">$600</span>
      </div>
      <div class="hud-stat">
        <span class="icon">&#10084;</span>
        <span class="label">HP</span>
        <span id="hud-hp">100</span>
        <div class="hp-bar-container">
          <div class="hp-bar-fill" id="hp-bar" style="width:100%"></div>
        </div>
      </div>
    </div>
    <div class="hud-right" id="tower-shop"></div>
    <div class="hud-bottom">
      <button class="btn btn-small" id="btn-start-wave">START WAVE</button>
      <div class="speed-controls">
        <button class="btn speed-btn active" data-speed="1">1x</button>
        <button class="btn speed-btn" data-speed="2">2x</button>
        <button class="btn speed-btn" data-speed="3">3x</button>
      </div>
      <button class="btn btn-small" id="btn-pause">Pause</button>
    </div>
  </div>

  <!-- Tower Upgrade Panel -->
  <div id="upgrade-panel" class="upgrade-panel hidden">
    <div class="upgrade-header">
      <span id="upgrade-tower-name">Tower</span>
      <button class="btn btn-tiny" id="btn-close-upgrade">&#10005;</button>
    </div>
    <div id="upgrade-stats" class="upgrade-stats"></div>
    <div id="upgrade-list" class="upgrade-list"></div>
    <div class="upgrade-actions">
      <button class="btn btn-small btn-sell" id="btn-sell-tower">SELL</button>
    </div>
  </div>

  <!-- Game Over -->
  <div id="game-over" class="overlay">
    <div class="menu-content">
      <h2 id="game-over-title">GAME OVER</h2>
      <p id="game-over-info">You survived 10 waves</p>
      <div id="game-over-stats" class="game-over-stats"></div>
      <div class="game-over-buttons">
        <button class="btn btn-primary" id="btn-retry">PLAY AGAIN</button>
        <button class="btn btn-back" id="btn-menu">MAIN MENU</button>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/projectiles.js"></script>
<script src="js/enemies.js"></script>
<script src="js/towers.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
