<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blockade tests</title>
<link rel="icon" href="data:,">
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; background: #111820; color: #e8e4d8; padding: 20px; }
  .ok { color: #7dff6a; } .bad { color: #ff6a5a; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Blockade tests</h1>
<p>The same tests <code>npm test</code> runs, in the browser (no Node needed).</p>
<div id="out"></div>
<script type="module">
  import { runAll } from './sim.test.js';
  const out = document.getElementById('out');
  const res = await runAll((line) => {
    const d = document.createElement('div');
    d.className = line.startsWith('✗') ? 'bad' : line.startsWith('✓') ? 'ok' : '';
    d.textContent = line;
    out.appendChild(d);
  });
  window.testResult = { passed: res.passed, failed: res.failed.map((f) => `${f.name}: ${f.error.message}`) };
  document.title = res.failed.length ? `✗ ${res.failed.length} failed` : `✓ ${res.passed} passed`;
</script>
</body>
</html>
